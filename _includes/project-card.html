<article class="project-row">
    <div class="project-heading">
        <h3><a href="{{ ui.projects_path | prepend: site.baseurl }}#{{ project.id }}">{{ project.title }}<span class="project-arrow" aria-hidden="true">↗</span></a></h3>
        <span class="date-label">{{ project.period }}</span>
    </div>
    <p class="project-description">{{ project.summary }}</p>
    <p class="technology-list">{{ project.stack | join: ' / ' }}</p>
</article>
