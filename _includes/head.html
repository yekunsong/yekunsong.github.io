<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="keywords" content="{{ site.keyword | escape }}">
    <meta name="theme-color" content="#ffffff">
    <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/img/avatar.svg' | prepend: site.baseurl }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | prepend: site.baseurl | prepend: site.url }}">
    {% if page.translation_url %}
    <link rel="alternate" hreflang="{{ document_lang }}" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    <link rel="alternate" hreflang="{{ page.translation_lang }}" href="{{ page.translation_url | prepend: site.baseurl | prepend: site.url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/css/profile.css' | prepend: site.baseurl }}">
    {% if page.layout == 'post' %}
    <link rel="stylesheet" href="{{ '/css/syntax.css' | prepend: site.baseurl }}">
    {% endif %}
</head>
