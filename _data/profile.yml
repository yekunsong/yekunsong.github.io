projects:
- id: chatrix
  title: Chatrix
  category: Customer service / RAG / Agent
  period: 2026 — present
  summary: A customer service system with hybrid retrieval, agent routing, source citations, input and output checks, and human handover.
  stack:
  - Vue 3
  - Node.js / Express
  - MySQL
  - Hybrid RAG
  - LLM
  role: Independent design and implementation
  details:
  - Implemented a full-stack platform with Vue 3, Node.js / Express, and MySQL. Built a pipeline covering request checks, FAQ matching, hybrid retrieval, conflict arbitration, generation, and response checks.
  - Combined BM25 and vector retrieval. Routed requests to FAQ answers, evidence-based answers, refusal, or human handover based on confidence thresholds and safety checks.
  - Supported PDF, Word, and Markdown ingestion with paragraph-level source citations.
  - Compiled structured persona settings into prompts for updates without service restarts. Used rule-based filtering and LLM verification to address prompt injection and unauthorized requests.
- id: defect-detection
  title: Industrial Surface Defect Detection
  category: Computer vision / Deep learning
  period: 2025 — 2026
  summary: Model modifications and comparative experiments targeting missed small defects and unstable localization in complex backgrounds.
  stack:
  - Python
  - PyTorch
  - YOLO
  - SAM
  role: Model optimization and experimental evaluation
  details:
  - Built training and evaluation workflows using PyTorch, YOLO, and SAM to investigate missed small defects and unstable localization in complex backgrounds.
  - Adjusted the detection head and introduced a segmentation module to refine candidate defect regions.
  - Prepared data, modified models, configured training, and conducted comparative experiments.
  - Ran ablation studies on network structure, data augmentation, and post-processing parameters, evaluating performance with mAP, Recall, and F1.
