projects:
- id: chatrix
  title: Chatrix
  category: Website AI agents / LLM applications / Full-stack development
  period: 2026 — present
  summary: An AI agent platform for enterprise websites, connecting company knowledge, visual workflows, website chat windows, and live support to answer questions, guide visitors, and complete controlled business tasks.
  stack:
  - Vue 3
  - Node.js / Express
  - MySQL
  - RAG
  - LLM
  role: Independent system design and full-stack development
  links:
  - label: Website
    url: https://www.yanjutech.com/en
  - label: Product overview
    url: https://www.yanjutech.com/en/product
  details:
  - Knowledge and answers. Integrated published FAQs, knowledge retrieval, and source citations into conversations, with explicit paths for fixed answers, evidence-based answers, refusal, and human handoff when knowledge is insufficient.
  - Agents and website releases. Separated editable drafts, immutable versions, and release records. Environment, site, and channel bindings determine the version used online, while registered website origins constrain widget access.
  - Workflows and execution. Defined structured node inputs and outputs, conditional branches, and tool calls, with waiting, resumption, and execution records. Tool execution follows version authorizations and the applicable confirmation requirements.
  - Data scope and human collaboration. Enforced platform, organization, and personal ownership boundaries. Human handoff retains visitor questions, assistant replies, and handoff summaries; question insights and run records support knowledge and workflow review.
- id: defect-detection
  title: Industrial Surface Defect Detection
  category: Computer vision / Deep learning
  period: 2025 — 2026
  summary: Model modifications and comparative experiments targeting missed small defects and unstable localization in complex backgrounds.
  stack:
  - Python
  - PyTorch
  - YOLO
  - SAM
  role: Model optimization and experimental evaluation
  details:
  - Built training and evaluation workflows using PyTorch, YOLO, and SAM to investigate missed small defects and unstable localization in complex backgrounds.
  - Adjusted the detection head and introduced a segmentation module to refine candidate defect regions.
  - Prepared data, modified models, configured training, and conducted comparative experiments.
  - Ran ablation studies on network structure, data augmentation, and post-processing parameters, evaluating performance with mAP, Recall, and F1.
