projects:
- id: chatrix
  title: 言矩
  category: 网站智能体 / 大模型应用 / 全栈开发
  period: 2026 年至今
  summary: 面向企业网站的智能体平台，连接企业知识、可视化工作流、网站窗口与人工服务，支持回答、引导和受控业务办理。
  stack:
  - Vue 3
  - Node.js / Express
  - MySQL
  - RAG
  - LLM
  role: 独立负责系统设计与全栈开发
  links:
  - label: 官网
    url: https://www.yanjutech.com/zh
  - label: 产品介绍
    url: https://www.yanjutech.com/zh/product
  details:
  - 知识与回答链路：将已发布 FAQ、知识检索与来源引用接入会话，为固定口径、基于证据的回答，以及知识不足时的拒答和人工交接保留明确处理分支。
  - 智能体与网站发布：分离可编辑草稿、不可变版本和发布记录，通过环境、站点与渠道绑定确定线上版本，并以登记的网站来源约束挂件接入。
  - 工作流与执行：用结构化节点定义输入输出、条件分支和工具调用，支持等待、恢复及运行记录；工具执行遵循版本授权和相应的确认要求。
  - 数据范围与人工协作：按平台、组织和个人归属校验访问范围，人工接管时延续访客问题、助手回答和交接摘要，并结合问题洞察与运行记录复盘知识和流程。
- id: defect-detection
  title: 工业表面缺陷检测优化
  category: 计算机视觉 / 深度学习
  period: 2025—2026 年
  summary: 面向复杂背景下的小缺陷漏检和定位不稳定问题，开展检测模型改进与对比实验。
  stack:
  - Python
  - PyTorch
  - YOLO
  - SAM
  role: 模型优化与实验评估
  details:
  - 使用 PyTorch、YOLO 与 SAM 搭建训练和评估流程，分析小缺陷漏检及定位不稳定问题。
  - 调整检测头，引入分割模块以细化候选缺陷区域。
  - 完成数据准备、模型修改、训练配置与对比实验。
  - 对网络结构、数据增强及后处理参数进行消融实验，使用 mAP、Recall 和 F1 评估结果。
