projects:
- id: chatrix
  title: 言矩
  category: 智能客服 / RAG / Agent
  period: 2026 年至今
  summary: 基于混合检索与 Agent 路由的客服系统，支持知识库引用追溯、请求与响应安全检查，以及人工转接。
  stack:
  - Vue 3
  - Node.js / Express
  - MySQL
  - RAG
  - LLM
  role: 独立设计与开发
  details:
  - 使用 Vue 3、Node.js / Express 与 MySQL 实现全栈平台，构建请求检查、FAQ 匹配、混合检索、冲突仲裁、答案生成与响应检查流程。
  - 结合 BM25 与向量检索，根据置信度及安全检查结果，在 FAQ 直答、基于证据回答、拒答和人工转接之间路由。
  - 支持 PDF、Word、Markdown 文档导入，并通过段落级引用追溯回答来源。
  - 将结构化角色配置编译为提示词，支持无需重启服务的配置更新；在输入和输出阶段结合规则过滤与 LLM 验证，处理提示注入与越权请求。
- id: defect-detection
  title: 工业表面缺陷检测优化
  category: 计算机视觉 / 深度学习
  period: 2025—2026 年
  summary: 面向复杂背景下的小缺陷漏检和定位不稳定问题，开展检测模型改进与对比实验。
  stack:
  - Python
  - PyTorch
  - YOLO
  - SAM
  role: 模型优化与实验评估
  details:
  - 使用 PyTorch、YOLO 与 SAM 搭建训练和评估流程，分析小缺陷漏检及定位不稳定问题。
  - 调整检测头，引入分割模块以细化候选缺陷区域。
  - 完成数据准备、模型修改、训练配置与对比实验。
  - 对网络结构、数据增强及后处理参数进行消融实验，使用 mAP、Recall 和 F1 评估结果。
